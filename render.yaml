databases:
  - name: tour-pass-db
    plan: free
    databaseName: tour_pass_db
    ipAllowList: []

services:
  - type: web
    name: tour-pass
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LLM_DISABLED
        value: "0"
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TOURPASS_JWT_SECRET
        sync: false
      - key: TOURPASS_ADMIN_USERS
        sync: false
      - key: TOURPASS_AMAP_API_KEY
        sync: false
      - key: QWEATHER_KEY
        sync: false
      - key: QWEATHER_API_HOST
        value: devapi.qweather.com
      - key: TOURPASS_MAX_BODY_BYTES
        value: "262144"
      - key: TOURPASS_DISTANCE_CACHE_MODE
        value: auto
      - key: TOURPASS_DB_PATH
        value: /app/storage/tourpass.sqlite
      - key: DATABASE_URL
        fromDatabase:
          name: tour-pass-db
          property: connectionString
      - key: AGENT_PORT
        value: "8090"
      - key: AGENT_BASE_URL
        value: http://127.0.0.1:8090
      - key: AGENT_IMPL
        value: multi
      - key: TOURPASS_ASSET_BASE_URL
        sync: false
