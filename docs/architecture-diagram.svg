<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Tour Pass 项目架构图</title>
  <desc id="desc">Tour Pass 的前端、C++ 主服务、Python 多 Agent 服务、数据层、外部服务和部署关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2410c" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #475569; }
      .layer-title { font: 700 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #475569; }
      .tag { font: 700 12px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #ffffff; }
      .frontend { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; }
      .cpp { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; }
      .agent { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .data { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .external { fill: #fdf2f8; stroke: #db2777; stroke-width: 1.5; }
      .neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .layer { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 7 6; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .line-green { fill: none; stroke: #0f766e; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .line-orange { fill: none; stroke: #c2410c; stroke-width: 2.2; marker-end: url(#arrow-orange); }
      .line-dashed { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .label { font: 700 12px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .shadow { filter: drop-shadow(0 8px 18px rgba(15, 23, 42, 0.08)); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1120" />
  <text class="title" x="56" y="58">Tour Pass 项目架构图</text>
  <text class="subtitle" x="56" y="86">当前默认部署链路：浏览器访问 C++ 主服务，C++ 负责静态资源、REST API、规划算法和网关代理，Python 多 Agent 作为 8090 辅服务提供 AI 编排能力。</text>

  <rect class="layer" x="40" y="115" width="1520" height="130" rx="12" />
  <text class="layer-title" x="64" y="145">用户入口与前端</text>

  <g class="shadow">
    <rect class="neutral" x="90" y="165" width="210" height="58" rx="8" />
    <text class="box-title" x="124" y="190">用户 / 浏览器</text>
    <text class="box-text" x="124" y="210">Web、移动端浏览器、curl</text>

    <rect class="frontend" x="385" y="155" width="270" height="78" rx="8" />
    <text class="box-title" x="415" y="181">主 Web 应用</text>
    <text class="box-text" x="415" y="202">web/index.html + web/app.js</text>
    <text class="box-text" x="415" y="220">AI 规划、Leaflet 地图、行程保存、XHS</text>

    <rect class="frontend" x="715" y="155" width="270" height="78" rx="8" />
    <text class="box-title" x="745" y="181">React 行程编辑器</text>
    <text class="box-text" x="745" y="202">web/editor，Vite + TypeScript</text>
    <text class="box-text" x="745" y="220">Wizard、拖拽、撤销重做、PDF</text>

    <rect class="frontend" x="1045" y="155" width="250" height="78" rx="8" />
    <text class="box-title" x="1075" y="181">管理 / 分享页面</text>
    <text class="box-text" x="1075" y="202">admin、profile、share</text>
    <text class="box-text" x="1075" y="220">用户、反馈、POI 管理、分享页</text>
  </g>

  <line class="line" x1="300" y1="194" x2="385" y2="194" />
  <line class="line" x1="300" y1="194" x2="715" y2="194" />
  <line class="line" x1="300" y1="194" x2="1045" y2="194" />

  <rect class="layer" x="40" y="275" width="1520" height="360" rx="12" />
  <text class="layer-title" x="64" y="305">C++ 主服务 :8080（cpp-httplib）</text>

  <g class="shadow">
    <rect class="cpp" x="90" y="330" width="210" height="88" rx="8" />
    <text class="box-title" x="122" y="356">静态资源服务</text>
    <text class="box-text" x="122" y="377">web/</text>
    <text class="box-text" x="122" y="396">web/editor-dist/</text>

    <rect class="cpp" x="355" y="330" width="250" height="88" rx="8" />
    <text class="box-title" x="383" y="356">中间件管线</text>
    <text class="box-text" x="383" y="377">CORS、JWT、限流、安全头</text>
    <text class="box-text" x="383" y="396">请求 ID、日志、指标</text>

    <rect class="cpp" x="660" y="330" width="250" height="88" rx="8" />
    <text class="box-title" x="688" y="356">REST API 路由</text>
    <text class="box-text" x="688" y="377">/trip、/poi、/route、/auth</text>
    <text class="box-text" x="688" y="396">/editor、/admin、/api</text>

    <rect class="cpp" x="965" y="330" width="250" height="88" rx="8" />
    <text class="box-title" x="993" y="356">运行时能力</text>
    <text class="box-text" x="993" y="377">线程池、响应缓存、异步任务</text>
    <text class="box-text" x="993" y="396">metrics、任务队列、背压</text>

    <rect class="cpp" x="1270" y="330" width="210" height="88" rx="8" />
    <text class="box-title" x="1298" y="356">Agent 网关代理</text>
    <text class="box-text" x="1298" y="377">/agent/*</text>
    <text class="box-text" x="1298" y="396">/api/xhs/*</text>

    <rect class="cpp" x="120" y="485" width="250" height="98" rx="8" />
    <text class="box-title" x="148" y="512">TripPlanner</text>
    <text class="box-text" x="148" y="533">Beam Search、候选行程</text>
    <text class="box-text" x="148" y="552">时间窗、餐饮插入、Pareto 排序</text>

    <rect class="cpp" x="430" y="485" width="250" height="98" rx="8" />
    <text class="box-title" x="458" y="512">PoiGraph</text>
    <text class="box-text" x="458" y="533">Dijkstra / A*</text>
    <text class="box-text" x="458" y="552">边权、距离缓存、路径坐标</text>

    <rect class="cpp" x="740" y="485" width="250" height="98" rx="8" />
    <text class="box-title" x="768" y="512">SearchEngine</text>
    <text class="box-text" x="768" y="533">BM25 检索</text>
    <text class="box-text" x="768" y="552">字段权重、匹配词解释</text>

    <rect class="cpp" x="1050" y="485" width="250" height="98" rx="8" />
    <text class="box-title" x="1078" y="512">Auth / DataStore</text>
    <text class="box-text" x="1078" y="533">JWT、角色、配额、行程保存</text>
    <text class="box-text" x="1078" y="552">PostgreSQL 或 SQLite</text>
  </g>

  <line class="line" x1="520" y1="233" x2="520" y2="330" />
  <line class="line" x1="850" y1="233" x2="850" y2="330" />
  <line class="line" x1="1170" y1="233" x2="1170" y2="330" />
  <line class="line" x1="300" y1="374" x2="355" y2="374" />
  <line class="line" x1="605" y1="374" x2="660" y2="374" />
  <line class="line" x1="910" y1="374" x2="965" y2="374" />
  <line class="line" x1="910" y1="374" x2="1270" y2="374" />
  <line class="line" x1="780" y1="418" x2="260" y2="485" />
  <line class="line" x1="780" y1="418" x2="555" y2="485" />
  <line class="line" x1="785" y1="418" x2="865" y2="485" />
  <line class="line" x1="800" y1="418" x2="1175" y2="485" />

  <rect class="layer" x="40" y="665" width="1520" height="270" rx="12" />
  <text class="layer-title" x="64" y="695">Python 多 Agent 服务 :8090（FastAPI + LangGraph）</text>

  <g class="shadow">
    <rect class="agent" x="95" y="725" width="220" height="80" rx="8" />
    <text class="box-title" x="123" y="751">Agent API</text>
    <text class="box-text" x="123" y="772">SSE、同步规划、多方案</text>
    <text class="box-text" x="123" y="790">聊天、会话、XHS 解析</text>

    <rect class="agent" x="380" y="725" width="220" height="80" rx="8" />
    <text class="box-title" x="408" y="751">LangGraph 工作流</text>
    <text class="box-text" x="408" y="772">graph.py</text>
    <text class="box-text" x="408" y="790">MemorySaver checkpointer</text>

    <rect class="agent" x="665" y="725" width="360" height="80" rx="8" />
    <text class="box-title" x="693" y="751">Agent 节点</text>
    <text class="box-text" x="693" y="772">Intent → Retrieve → Data Gather → Scheduler</text>
    <text class="box-text" x="693" y="790">Reviewer 循环 → Ticket → Summary</text>

    <rect class="agent" x="1090" y="725" width="210" height="80" rx="8" />
    <text class="box-title" x="1118" y="751">Tools</text>
    <text class="box-text" x="1118" y="772">RAG、route、cache、session</text>
    <text class="box-text" x="1118" y="790">weather、XHS parser</text>

    <rect class="agent" x="1360" y="725" width="150" height="80" rx="8" />
    <text class="box-title" x="1388" y="751">缓存</text>
    <text class="box-text" x="1388" y="772">Redis 可选</text>
    <text class="box-text" x="1388" y="790">内存 fallback</text>

    <rect class="neutral" x="190" y="850" width="1230" height="42" rx="8" />
    <text class="small" x="218" y="876">并行数据采集：PoiAgent 先加载 POI，HotelAgent / WeatherAgent / RestaurantAgent 并发执行；Scheduler 可调用 C++ /api/optimize-route 做路线优化。</text>
  </g>

  <path class="line-green" d="M1375 418 C1375 520, 205 600, 205 725" />
  <line class="line-green" x1="315" y1="765" x2="380" y2="765" />
  <line class="line-green" x1="600" y1="765" x2="665" y2="765" />
  <line class="line-green" x1="1025" y1="765" x2="1090" y2="765" />
  <line class="line-green" x1="1300" y1="765" x2="1360" y2="765" />
  <path class="line-dashed" d="M1195 805 C1195 922, 760 625, 760 418" />
  <text class="label" x="865" y="650">路线优化回调 C++</text>

  <rect class="layer" x="40" y="965" width="1520" height="120" rx="12" />
  <text class="layer-title" x="64" y="995">数据、存储与外部服务</text>

  <g class="shadow">
    <rect class="data" x="95" y="1018" width="285" height="48" rx="8" />
    <text class="box-title" x="120" y="1040">data/{city}/ 城市数据</text>
    <text class="box-text" x="120" y="1058">pois、edges、guidebook、city_guide、xhs_routes</text>

    <rect class="data" x="430" y="1018" width="210" height="48" rx="8" />
    <text class="box-title" x="455" y="1040">config/ 与 scripts/</text>
    <text class="box-text" x="455" y="1058">采集、清洗、校验、配置</text>

    <rect class="data" x="690" y="1018" width="240" height="48" rx="8" />
    <text class="box-title" x="715" y="1040">PostgreSQL / SQLite</text>
    <text class="box-text" x="715" y="1058">用户、行程、反馈、历史、指标</text>

    <rect class="external" x="980" y="1018" width="230" height="48" rx="8" />
    <text class="box-title" x="1005" y="1040">DeepSeek / OpenAI 兼容</text>
    <text class="box-text" x="1005" y="1058">意图解析、审核、总结、解释</text>

    <rect class="external" x="1260" y="1018" width="230" height="48" rx="8" />
    <text class="box-title" x="1285" y="1040">高德 / 和风 / 百度 OCR</text>
    <text class="box-text" x="1285" y="1058">路线、天气、图片文字识别</text>
  </g>

  <path class="line-orange" d="M245 583 C245 770, 238 905, 238 1018" />
  <path class="line-orange" d="M555 583 C555 770, 238 905, 238 1018" />
  <path class="line-orange" d="M865 583 C865 770, 238 905, 238 1018" />
  <path class="line-orange" d="M1175 583 C1175 800, 810 912, 810 1018" />
  <path class="line-orange" d="M1195 805 C1195 905, 238 905, 238 1018" />
  <path class="line-dashed" d="M490 805 C490 910, 1095 910, 1095 1018" />
  <path class="line-dashed" d="M1195 805 C1195 930, 1375 930, 1375 1018" />

  <rect x="56" y="105" width="95" height="25" rx="12" fill="#334155" />
  <text class="tag" x="78" y="122">图表版</text>
  <text class="small" x="1290" y="1100">生成时间：2026-07-02 14:15</text>
</svg>
