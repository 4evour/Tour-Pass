openapi: 3.0.3
info:
  title: Tour Pass API
  version: 2.6.0
  description: C++17 城市自由行结构化行程规划算法服务 API。当前数据为演示样例，不代表真实地图或生产 SLA。
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service status and runtime configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data_loaded: { type: boolean }
                  poi_count: { type: integer, example: 25 }
                  edge_count: { type: integer, example: 46 }
                  distance_cache:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      mode: { type: string, enum: [all_pairs, on_demand, disabled] }
                      poi_count: { type: integer }
                      entries: { type: integer }
                      max_entries: { type: integer }
                      hits: { type: integer }
                      misses: { type: integer }
                      evictions: { type: integer }
                      startup_ms: { type: integer }
                  llm_configured: { type: boolean }
                  workers: { type: integer }
                  job_workers: { type: integer }
                  max_queue: { type: integer }
                  max_in_flight: { type: integer }
                  cache_enabled: { type: boolean }
                  db_enabled: { type: boolean }
                  db_path: { type: string }
  /trip/plan:
    post:
      summary: Generate itinerary or candidate itineraries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripRequest"
      responses:
        "200":
          description: Itinerary response. When candidate_count > 1, returns candidates.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Itinerary"
                  - type: object
                    properties:
                      city: { type: string }
                      candidates:
                        type: array
                        items: { $ref: "#/components/schemas/Itinerary" }
        "400":
          $ref: "#/components/responses/Error"
  /route/shortest:
    get:
      summary: Query shortest route between two POIs
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: algorithm
          in: query
          schema:
            type: string
            enum: [dijkstra, astar]
            default: dijkstra
      responses:
        "200":
          description: Shortest route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResult"
        "404":
          $ref: "#/components/responses/Error"
  /poi/search:
    get:
      summary: Search POIs with BM25-style scoring
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema:
            type: string
            enum: [attraction, restaurant, hotel, nightlife]
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
  /trip/alternatives:
    post:
      summary: Return replacement POIs for scenario changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: string
                  example: 下雨
                limit:
                  type: integer
                  default: 5
      responses:
        "200":
          description: Alternative POIs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenario: { type: string }
                  strategy: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
  /itinerary/explain:
    post:
      summary: Generate Chinese itinerary explanation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Explanation response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  explanation: { type: string }
                  llm_configured: { type: boolean }
  /trip/jobs:
    post:
      summary: Submit asynchronous trip planning job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripRequest"
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string, example: QUEUED }
                  status_url: { type: string }
        "429":
          $ref: "#/components/responses/Error"
  /trip/jobs/{id}:
    get:
      summary: Get asynchronous job status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripJob"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Cancel job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string, example: CANCELLED }
  /metrics:
    get:
      summary: Runtime metrics snapshot
      responses:
        "200":
          description: Metrics.
          content:
            application/json:
              schema:
                type: object
  /history/jobs:
    get:
      summary: Recent persisted jobs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Recent jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
  /benchmark/runs:
    post:
      summary: Persist local benchmark summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                started_at: { type: string }
                duration_seconds: { type: integer }
                concurrency_steps_json: { type: string }
                summary_json: { type: string }
                report_path: { type: string }
      responses:
        "201":
          description: Benchmark recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: recorded }
components:
  responses:
    Error:
      description: Structured error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
    TripRequest:
      type: object
      properties:
        city: { type: string, default: 长沙 }
        days: { type: integer, minimum: 1, maximum: 7, default: 1 }
        start_time: { type: string, example: "09:30" }
        end_time: { type: string, example: "21:30" }
        hotel_location: { type: string, example: 五一广场酒店 }
        interests:
          type: array
          items: { type: string }
        pace: { type: string, example: 轻松 }
        must_visit:
          type: array
          items: { type: string }
        avoid:
          type: array
          items: { type: string }
        candidate_count: { type: integer, minimum: 1, maximum: 5, default: 1 }
        strategy: { type: string, default: balanced }
    Itinerary:
      type: object
      properties:
        city: { type: string }
        variant_name: { type: string }
        strategy: { type: string }
        total_score: { type: number }
        comparison: { type: object }
        days:
          type: array
          items: { $ref: "#/components/schemas/DayPlan" }
        alternatives:
          type: array
          items: { type: string }
    DayPlan:
      type: object
      properties:
        day: { type: integer }
        summary: { type: string }
        total_travel_minutes: { type: integer }
        time_window_feasible: { type: boolean }
        beam_trace:
          type: array
          items: { type: object }
        stops:
          type: array
          items: { $ref: "#/components/schemas/Stop" }
    Stop:
      type: object
      properties:
        slot: { type: string }
        poi_id: { type: string }
        poi_name: { type: string }
        start_time: { type: string }
        end_time: { type: string }
        travel_minutes_from_previous: { type: integer }
        score: { type: number }
        reason: { type: string }
        score_breakdown:
          type: array
          items: { type: object }
    RouteResult:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        travel_minutes: { type: integer }
        path:
          type: array
          items: { type: string }
        algorithm: { type: string }
    SearchResult:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        area: { type: string }
        score: { type: number }
        matched_terms:
          type: array
          items: { type: string }
        score_explanation: { type: string }
        score_contributions:
          type: array
          items: { type: object }
    TripJob:
      type: object
      properties:
        job_id: { type: string }
        status: { type: string }
        result: { type: object }
        error: { type: object }
        queue_wait_ms: { type: integer }
        execution_ms: { type: integer }
