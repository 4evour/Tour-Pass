openapi: 3.0.3
info:
  title: Tour Pass API
  version: 3.0.0
  description: C++17 网关 + Python Grounded Planner 的城市自由行服务 API；旧规划接口在迁移期保留。
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service status and runtime configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data_loaded: { type: boolean }
                  poi_count: { type: integer, example: 25 }
                  edge_count: { type: integer, example: 46 }
                  distance_cache:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      mode: { type: string, enum: [all_pairs, on_demand, disabled] }
                      poi_count: { type: integer }
                      entries: { type: integer }
                      max_entries: { type: integer }
                      hits: { type: integer }
                      misses: { type: integer }
                      evictions: { type: integer }
                      startup_ms: { type: integer }
                  llm_configured: { type: boolean }
                  workers: { type: integer }
                  job_workers: { type: integer }
                  max_queue: { type: integer }
                  max_in_flight: { type: integer }
                  cache_enabled: { type: boolean }
                  db_enabled: { type: boolean }
                  db_path: { type: string }
  /api/itineraries/plan:
    post:
      summary: Generate a grounded itinerary as SSE
      description: Only city is required. Empty optional fields use transparent defaults; special_requests are retained and deterministic constraints are extracted when possible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroundedPlanRequest"
      responses:
        "200":
          description: SSE events accepted, stage, result/error and done.
          content:
            text/event-stream:
              schema: { type: string }
        "422":
          $ref: "#/components/responses/Error"
  /trip/plan:
    post:
      summary: Generate itinerary or candidate itineraries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripRequest"
      responses:
        "200":
          description: Itinerary response. When candidate_count > 1, returns candidates.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Itinerary"
                  - type: object
                    properties:
                      city: { type: string }
                      candidates:
                        type: array
                        items: { $ref: "#/components/schemas/Itinerary" }
        "400":
          $ref: "#/components/responses/Error"
  /route/shortest:
    get:
      summary: Query shortest route between two POIs
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: algorithm
          in: query
          schema:
            type: string
            enum: [dijkstra, astar]
            default: dijkstra
      responses:
        "200":
          description: Shortest route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResult"
        "404":
          $ref: "#/components/responses/Error"
  /poi/search:
    get:
      summary: Search POIs with BM25-style scoring
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema:
            type: string
            enum: [attraction, restaurant, hotel, nightlife]
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
  /trip/alternatives:
    post:
      summary: Return replacement POIs for scenario changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: string
                  example: 下雨
                limit:
                  type: integer
                  default: 5
      responses:
        "200":
          description: Alternative POIs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenario: { type: string }
                  strategy: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
  /itinerary/explain:
    post:
      summary: Generate Chinese itinerary explanation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Explanation response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  explanation: { type: string }
                  llm_configured: { type: boolean }
  /trip/chat:
    post:
      summary: Natural language trip planning
      description: |
        LLM + Beam Search hybrid endpoint. Accepts natural language input,
        parses intent via LLM, matches POIs via BM25, plans via Beam Search,
        and returns structured candidates with a natural language reply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: Natural language trip request
                  example: "帮我规划3天长沙之旅，想去橘子洲头和岳麓山"
                context:
                  type: array
                  description: Multi-turn conversation history
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
      responses:
        "200":
          description: Trip planning result with natural language reply.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string, description: Natural language itinerary summary }
                  parsed_request:
                    $ref: "#/components/schemas/TripRequest"
                  poi_matching:
                    type: array
                    items:
                      type: object
                      properties:
                        query: { type: string }
                        matched_id: { type: string, nullable: true }
                        matched_name: { type: string, nullable: true }
                        score: { type: number }
                        confidence: { type: string, enum: [high, medium, none] }
                  candidates:
                    type: array
                    items:
                      type: object
                  suggestions:
                    type: array
                    items: { type: string }
        "400":
          description: Empty message.
        "422":
          description: LLM failed to parse the request.
        "503":
          description: LLM not configured.
  /trip/jobs:
    post:
      summary: Submit asynchronous trip planning job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripRequest"
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string, example: QUEUED }
                  status_url: { type: string }
        "429":
          $ref: "#/components/responses/Error"
  /trip/jobs/{id}:
    get:
      summary: Get asynchronous job status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripJob"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Cancel job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string, example: CANCELLED }
  /metrics:
    get:
      summary: Runtime metrics snapshot
      responses:
        "200":
          description: Metrics.
          content:
            application/json:
              schema:
                type: object
  /history/jobs:
    get:
      summary: Recent persisted jobs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Recent jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
  /benchmark/runs:
    post:
      summary: Persist local benchmark summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                started_at: { type: string }
                duration_seconds: { type: integer }
                concurrency_steps_json: { type: string }
                summary_json: { type: string }
                report_path: { type: string }
      responses:
        "201":
          description: Benchmark recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: recorded }
components:
  responses:
    Error:
      description: Structured error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
    TripRequest:
      type: object
      properties:
        city: { type: string, default: 长沙 }
        days: { type: integer, minimum: 1, maximum: 7, default: 1 }
        start_time: { type: string, example: "09:30" }
        end_time: { type: string, example: "21:30" }
        hotel_location: { type: string, example: 五一广场酒店 }
        interests:
          type: array
          items: { type: string }
        pace: { type: string, example: 轻松 }
        must_visit:
          type: array
          items: { type: string }
        avoid:
          type: array
          items: { type: string }
        candidate_count: { type: integer, minimum: 1, maximum: 5, default: 1 }
        strategy: { type: string, default: balanced }
    GroundedPlanRequest:
      type: object
      required: [city]
      properties:
        city: { type: string, example: 长沙 }
        days: { type: integer, minimum: 1, maximum: 7, default: 3, nullable: true }
        date_start: { type: string, format: date, nullable: true }
        daily_start: { type: string, default: "09:00" }
        daily_end: { type: string, default: "21:30" }
        pace: { type: string, enum: [relaxed, balanced, intense], default: balanced, nullable: true }
        strategy: { type: string, enum: [balanced, culture, culinary, nature], default: balanced, nullable: true }
        budget: { type: string, enum: [budget, mid-range, luxury], nullable: true }
        travelers: { type: string, nullable: true }
        interests:
          type: array
          nullable: true
          items: { type: string }
        must_visit:
          type: array
          nullable: true
          items: { type: string }
        avoid:
          type: array
          nullable: true
          items: { type: string }
        hotel_name: { type: string, nullable: true }
        hotel_area: { type: string, nullable: true }
        transport_mode: { type: string, enum: [driving, walking, transit], default: driving, nullable: true }
        special_requests: { type: string, nullable: true }
    Itinerary:
      type: object
      properties:
        city: { type: string }
        variant_name: { type: string }
        strategy: { type: string }
        total_score: { type: number }
        comparison: { type: object }
        days:
          type: array
          items: { $ref: "#/components/schemas/DayPlan" }
        alternatives:
          type: array
          items: { type: string }
    DayPlan:
      type: object
      properties:
        day: { type: integer }
        summary: { type: string }
        total_travel_minutes: { type: integer }
        time_window_feasible: { type: boolean }
        beam_trace:
          type: array
          items: { type: object }
        stops:
          type: array
          items: { $ref: "#/components/schemas/Stop" }
    Stop:
      type: object
      properties:
        slot: { type: string }
        poi_id: { type: string }
        poi_name: { type: string }
        start_time: { type: string }
        end_time: { type: string }
        travel_minutes_from_previous: { type: integer }
        score: { type: number }
        reason: { type: string }
        score_breakdown:
          type: array
          items: { type: object }
    RouteResult:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        travel_minutes: { type: integer }
        path:
          type: array
          items: { type: string }
        algorithm: { type: string }
    SearchResult:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        area: { type: string }
        score: { type: number }
        matched_terms:
          type: array
          items: { type: string }
        score_explanation: { type: string }
        score_contributions:
          type: array
          items: { type: object }
    TripJob:
      type: object
      properties:
        job_id: { type: string }
        status: { type: string }
        result: { type: object }
        error: { type: object }
        queue_wait_ms: { type: integer }
        execution_ms: { type: integer }
