<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tour Pass - 分享行程</title>
  <link rel="icon" href="data:,"/>
  <link rel="stylesheet" href="/vendor/leaflet.css"/>
  <style>
    :root{--accent:#146b5d;--accent-dark:#0c4d43;--bg:#f5f7f6;--surface:#fff;--ink:#17211f;--muted:#65706d;--line:#dce3df;--soft:#e9f1ef;}
    *{box-sizing:border-box;margin:0;}
    body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);}
    .share-shell{max-width:900px;margin:0 auto;padding:20px;}
    .share-header{text-align:center;padding:30px 0 20px;}
    .share-header h1{font-size:28px;color:var(--accent);}
    .share-header p{color:var(--muted);font-size:14px;margin-top:4px;}
    .share-map{height:350px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:20px;}
    .stats-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
    .stat{flex:1;min-width:100px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
    .stat strong{display:block;font-size:22px;color:var(--accent);}
    .stat span{font-size:12px;color:var(--muted);}
    .day-block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
    .day-title{font-size:18px;color:var(--accent);margin-bottom:4px;}
    .day-stats{font-size:12px;color:var(--muted);margin-bottom:12px;}
    .stop-card{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;}
    .stop-transport{background:var(--soft);padding:4px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);}
    .stop-main{display:flex;gap:12px;padding:10px 14px;align-items:flex-start;}
    .stop-img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#eee;}
    .stop-icon{font-size:24px;flex-shrink:0;}
    .stop-info{flex:1;}
    .stop-name{font-size:15px;font-weight:600;}
    .stop-time{display:inline-block;font-size:12px;color:var(--muted);background:var(--soft);padding:2px 8px;border-radius:999px;margin-left:8px;}
    .stop-meta{font-size:12px;color:var(--muted);margin-top:2px;}
    .stop-reason{font-size:13px;margin-top:4px;line-height:1.4;}
    .stop-tip{font-size:12px;color:var(--accent-dark);background:var(--soft);padding:4px 8px;border-radius:6px;margin-top:4px;line-height:1.4;}
    .cost-bar{background:var(--soft);border-radius:10px;padding:12px 20px;text-align:center;font-size:14px;margin-top:20px;}
    .cost-bar strong{color:var(--accent);}
    .share-footer{text-align:center;padding:30px 0;color:var(--muted);font-size:13px;}
    .share-footer a{color:var(--accent);text-decoration:none;font-weight:600;}
    .legend{display:flex;gap:12px;justify-content:center;margin:8px 0;font-size:12px;color:var(--muted);}
    .legend span{display:flex;align-items:center;gap:4px;}
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
    .no-data{text-align:center;padding:60px 20px;color:var(--muted);}
    @media(max-width:600px){.share-map{height:250px;}.stats-row{gap:6px;}.stat{padding:8px;}}
  </style>
</head>
<body>
  <div class="share-shell">
    <div id="content"><div class="no-data">加载中...</div></div>
  </div>
  <script src="/vendor/leaflet.js"></script>
  <script>
    const COLORS=["#146b5d","#c25b1e","#2563eb","#9333ea","#dc2626","#0d9488","#d97706"];
    const ICONS={attraction:"🏛",restaurant:"🍜",hotel:"🏨",nightlife:"🌙",transit:"🚇"};
    function icon(t){return ICONS[t]||"📍";}
    function transportIcon(m){if(m<=0)return"";if(m<=15)return"🚶";if(m<=30)return"🚌";return"🚕";}
    function esc(t){const d=document.createElement("div");d.textContent=t||"";return d.innerHTML;}
    function estimateCost(stops){let lo=0,hi=0;for(const s of stops){const t=s.poi_type||"";if(t==="attraction"){lo+=20;hi+=80;}else if(t==="restaurant"){lo+=30;hi+=100;}else if(t==="nightlife"){lo+=50;hi+=150;}}const tr=stops.reduce((a,s)=>a+(s.travel_minutes_from_previous||0),0);lo+=Math.round(tr*0.5);hi+=Math.round(tr*2);return{lo,hi};}

    const data=window.__SHARE_DATA__;
    if(!data){document.getElementById("content").innerHTML='<div class="no-data"><h2>😕</h2><p>行程数据加载失败</p></div>';}
    else{
      let resp;
      try{
        const rj=data.response_json;
        resp=typeof rj==="string"?JSON.parse(rj):(rj||{});
      }catch(e){
        console.error("Failed to parse response_json:",e);
        resp={};
      }
      const days=resp.days||[];
      const title=data.title||"旅行行程";
      const totalLo=days.reduce((s,d)=>s+estimateCost(d.stops||[]).lo,0);
      const totalHi=days.reduce((s,d)=>s+estimateCost(d.stops||[]).hi,0);
      const totalStops=days.reduce((s,d)=>s+(d.stops||[]).length,0);
      const totalTravel=days.reduce((s,d)=>s+(d.total_travel_minutes||0),0);

      let html=`
        <div class="share-header">
          <h1>🗺️ ${esc(title)}</h1>
          <p>由 Tour Pass AI 生成 · ${days.length}天行程</p>
        </div>
        <div id="shareMap" class="share-map"></div>
        <div class="legend">${days.map((d,i)=>`<span><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>Day ${d.day}</span>`).join("")}</div>
        <div class="stats-row">
          <div class="stat"><strong>${days.length}</strong><span>天</span></div>
          <div class="stat"><strong>${totalStops}</strong><span>站</span></div>
          <div class="stat"><strong>${totalTravel}</strong><span>分钟通勤</span></div>
          <div class="stat"><strong>¥${totalLo}-${totalHi}</strong><span>预估花费</span></div>
        </div>`;

      days.forEach(day=>{
        const stops=day.stops||[];
        const cost=estimateCost(stops);
        html+=`<div class="day-block">
          <div class="day-title">Day ${day.day}</div>
          <div class="day-stats">${stops.length}站 · ${day.total_travel_minutes||0}min通勤 · ≈¥${cost.lo}-${cost.hi}</div>`;
        stops.forEach((stop,j)=>{
          const tr=stop.travel_minutes_from_previous||0;
          html+=`<div class="stop-card">
            ${tr>0?`<div class="stop-transport">${transportIcon(tr)} ${tr}分钟</div>`:""}
            <div class="stop-main">
              <div class="stop-icon">${icon(stop.poi_type)}</div>
              <div class="stop-info">
                <div><span class="stop-name">${esc(stop.poi_name)}</span><span class="stop-time">${esc(stop.start_time||"")}-${esc(stop.end_time||"")}</span></div>
                <div class="stop-meta">${esc(stop.area||"")}</div>
                <div class="stop-reason">${esc(stop.reason||"")}</div>
                ${stop.recommendation?`<div class="stop-tip">💡 ${esc(stop.recommendation)}</div>`:""}
              </div>
            </div>
          </div>`;
        });
        html+=`</div>`;
      });

      html+=`<div class="cost-bar">全程预估花费：<strong>¥${totalLo}-${totalHi}</strong>（含门票、餐饮、交通估算）</div>
        <div class="share-footer">由 <a href="/">Tour Pass</a> AI 旅行规划生成</div>`;

      document.getElementById("content").innerHTML=html;

      // Render map
      if(typeof L!=="undefined"){
        const map=L.map("shareMap");
        L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",{subdomains:"1234",maxZoom:18,attribution:'© 高德地图'}).addTo(map);
        const bounds=[];let idx=0;
        days.forEach((day,di)=>{
          const color=COLORS[di%COLORS.length];const coords=[];
          (day.stops||[]).forEach(stop=>{
            if(!stop.lat||!stop.lng)return;idx++;
            const c=[stop.lat,stop.lng];bounds.push(c);coords.push(c);
            const ic=L.divIcon({className:"",html:`<div style="background:${color};color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);">${idx}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
            L.marker(c,{icon:ic}).addTo(map).bindPopup(`<strong>${esc(stop.poi_name)}</strong><br>${icon(stop.poi_type)} ${stop.start_time}-${stop.end_time}<br>${esc(stop.area||"")}`);
          });
          if(coords.length>1)L.polyline(coords,{color,weight:3,opacity:0.7,dashArray:di>0?"6 4":null}).addTo(map);
        });
        if(bounds.length>0)map.fitBounds(bounds,{padding:[30,30]});
      }
    }
  </script>
</body>
</html>
