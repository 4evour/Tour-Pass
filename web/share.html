<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tour Pass - 分享行程</title>
  <link rel="icon" href="data:,"/>
  <link rel="stylesheet" href="/vendor/leaflet.css"/>
  <style>
    :root{--accent:#146b5d;--accent-dark:#0c4d43;--bg:#f5f7f6;--surface:#fff;--ink:#17211f;--muted:#65706d;--line:#dce3df;--soft:#e9f1ef;}
    *{box-sizing:border-box;margin:0;}
    body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);}
    .share-shell{max-width:900px;margin:0 auto;padding:20px;}
    .share-header{text-align:center;padding:30px 0 20px;}
    .share-header h1{font-size:28px;color:var(--accent);}
    .share-header p{color:var(--muted);font-size:14px;margin-top:4px;}
    .share-map{height:350px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:20px;}
    .stats-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
    .stat{flex:1;min-width:100px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
    .stat strong{display:block;font-size:22px;color:var(--accent);}
    .stat span{font-size:12px;color:var(--muted);}
    .day-block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
    .day-title{font-size:18px;color:var(--accent);margin-bottom:4px;}
    .day-stats{font-size:12px;color:var(--muted);margin-bottom:12px;}
    .stop-card{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;}
    .stop-transport{background:var(--soft);padding:4px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);}
    .stop-main{display:flex;gap:12px;padding:10px 14px;align-items:flex-start;}
    .stop-img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#eee;}
    .stop-icon{font-size:24px;flex-shrink:0;}
    .stop-info{flex:1;}
    .stop-name{font-size:15px;font-weight:600;}
    .stop-time{display:inline-block;font-size:12px;color:var(--muted);background:var(--soft);padding:2px 8px;border-radius:999px;margin-left:8px;}
    .stop-meta{font-size:12px;color:var(--muted);margin-top:2px;}
    .stop-reason{font-size:13px;margin-top:4px;line-height:1.4;}
    .stop-tip{font-size:12px;color:var(--accent-dark);background:var(--soft);padding:4px 8px;border-radius:6px;margin-top:4px;line-height:1.4;}
    .cost-bar{background:var(--soft);border-radius:10px;padding:12px 20px;text-align:center;font-size:14px;margin-top:20px;}
    .cost-bar strong{color:var(--accent);}
    .share-footer{text-align:center;padding:30px 0;color:var(--muted);font-size:13px;}
    .share-footer a{color:var(--accent);text-decoration:none;font-weight:600;}
    .legend{display:flex;gap:12px;justify-content:center;margin:8px 0;font-size:12px;color:var(--muted);}
    .legend span{display:flex;align-items:center;gap:4px;}
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
    .no-data{text-align:center;padding:60px 20px;color:var(--muted);}
    @media(max-width:600px){.share-map{height:250px;}.stats-row{gap:6px;}.stat{padding:8px;}}
  </style>
</head>
<body>
  <div class="share-shell">
    <div id="content"><div class="no-data">加载中...</div></div>
  </div>
  <script src="/vendor/leaflet.js"></script>
  <script src="/share-render.js"></script>
</body>
</html>
