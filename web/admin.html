<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tour Pass 管理后台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .admin-shell { max-width: 1100px; margin: 0 auto; padding: 20px; }
      .admin-topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
      .admin-topbar h1 { font-size: 20px; margin: 0; }
      .admin-topbar h1 small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 8px; }
      .admin-nav { display: flex; gap: 8px; margin-bottom: 20px; }
      .admin-nav button { padding: 8px 16px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 13px; transition: all 0.2s; }
      .admin-nav button.active { border-color: var(--accent); background: var(--soft); color: var(--accent-dark); font-weight: 600; }
      .admin-section { display: none; }
      .admin-section.active { display: block; }

      /* Dashboard */
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
      .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; text-align: center; }
      .stat-card .num { font-size: 32px; font-weight: 700; color: var(--accent); }
      .stat-card .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
      .chart-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
      .chart-wrap h3 { margin: 0 0 12px; font-size: 15px; }
      #queryChart { width: 100%; height: 200px; }

      /* Table */
      .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .admin-table th { text-align: left; padding: 8px 12px; background: var(--soft); border-bottom: 2px solid var(--line); font-weight: 600; color: var(--muted); }
      .admin-table td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
      .admin-table tr:hover td { background: var(--soft); }

      /* Feedback */
      .fb-filter { display: flex; gap: 8px; margin-bottom: 12px; }
      .fb-filter button { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 12px; }
      .fb-filter button.active { border-color: var(--accent); background: var(--soft); font-weight: 600; }
      .fb-item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
      .fb-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .fb-item-header strong { font-size: 14px; }
      .fb-badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; }
      .fb-badge.pending { background: #fce4e4; color: #c0392b; }
      .fb-badge.reviewed { background: #e8f4f0; color: var(--accent); }
      .fb-badge.resolved { background: var(--soft); color: var(--muted); }
      .fb-content { font-size: 13px; margin-bottom: 8px; line-height: 1.5; }
      .fb-meta { font-size: 11px; color: var(--muted); }
      .fb-reply { margin-top: 8px; display: flex; gap: 8px; }
      .fb-reply input { flex: 1; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
      .fb-reply button { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; }

      .admin-error { padding: 40px; text-align: center; color: var(--muted); }

      /* POI Management */
      .poi-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
      .poi-select, .poi-input { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; background: var(--surface); }
      .poi-input { flex: 1; min-width: 200px; }
      .poi-count { font-size: 13px; color: var(--muted); margin-left: auto; }
      .poi-list { display: grid; gap: 8px; }
      .poi-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; cursor: pointer; transition: border-color 0.15s; }
      .poi-card:hover { border-color: var(--accent); }
      .poi-thumb { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--soft); }
      .poi-thumb-placeholder { width: 64px; height: 64px; border-radius: 8px; background: var(--soft); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 24px; }
      .poi-info h4 { margin: 0 0 4px; font-size: 14px; }
      .poi-info h4 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
      .poi-meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
      .poi-meta span { white-space: nowrap; }
      .poi-actions { display: flex; gap: 6px; }
      .poi-actions button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 12px; transition: all 0.15s; }
      .poi-actions button:hover { border-color: var(--accent); color: var(--accent); }
      .poi-pagination { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
      .poi-pagination button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 13px; }
      .poi-pagination button.active { border-color: var(--accent); background: var(--soft); font-weight: 600; }
      .poi-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

      /* Modal */
      .poi-modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; }
      .poi-modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
      .poi-modal-content { position: relative; background: var(--surface); border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); width: 90%; max-width: 600px; max-height: 85vh; display: flex; flex-direction: column; }
      .poi-modal-wide { max-width: 900px; }
      .poi-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
      .poi-modal-header h3 { margin: 0; font-size: 16px; }
      .poi-modal-close { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--muted); padding: 4px 8px; }
      .poi-modal-body { padding: 20px; overflow-y: auto; flex: 1; }
      .poi-modal-footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
      .btn-cancel { padding: 8px 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 13px; }
      .btn-save { padding: 8px 20px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }

      /* Edit form */
      .poi-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .poi-form .full { grid-column: 1 / -1; }
      .poi-form label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
      .poi-form input, .poi-form select, .poi-form textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; box-sizing: border-box; background: var(--surface); }
      .poi-form textarea { resize: vertical; min-height: 60px; }
      .poi-form .tags-input { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 6px; min-height: 36px; }
      .poi-form .tag { background: var(--soft); padding: 2px 8px; border-radius: 999px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
      .poi-form .tag button { border: none; background: none; cursor: pointer; font-size: 14px; color: var(--muted); padding: 0; }
      .poi-form .tag-input-field { border: none; outline: none; font-size: 13px; flex: 1; min-width: 80px; }

      /* Image picker */
      .img-picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
      .img-picker-card { border: 3px solid transparent; border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color 0.15s; position: relative; }
      .img-picker-card.selected { border-color: var(--accent); }
      .img-picker-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
      .img-picker-card .img-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.5); color: #fff; font-size: 11px; padding: 4px 8px; text-align: center; }
      .img-picker-current { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
      .img-picker-current img { width: 120px; border-radius: 8px; vertical-align: middle; margin-left: 8px; }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <div class="admin-topbar">
        <h1>Tour Pass <small>管理后台</small></h1>
        <div>
          <span id="adminUser" style="font-size:13px;color:var(--accent);margin-right:12px;"></span>
          <a href="/" style="font-size:13px;color:var(--muted);margin-right:12px;">返回首页</a>
          <button id="adminLogoutBtn" type="button" style="font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--muted);">退出登录</button>
        </div>
      </div>

      <div id="adminLogin" class="admin-error" hidden>
        <p>需要管理员权限才能访问此页面。</p>
        <p><a href="/">返回首页登录</a></p>
      </div>

      <div id="adminContent" hidden>
        <nav class="admin-nav">
          <button class="active" data-tab="dashboard">📊 仪表盘</button>
          <button data-tab="users">👥 用户管理</button>
          <button data-tab="feedback">💬 反馈管理</button>
          <button data-tab="pois">🏔️ 景点管理</button>
        </nav>

        <!-- Dashboard -->
        <section id="sec-dashboard" class="admin-section active">
          <div class="stats-grid" id="statsGrid"></div>
          <div class="chart-wrap">
            <h3>近 14 天查询量趋势</h3>
            <canvas id="queryChart"></canvas>
          </div>
        </section>

        <!-- Users -->
        <section id="sec-users" class="admin-section">
          <table class="admin-table">
            <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>累计查询</th><th>注册时间</th><th>操作</th></tr></thead>
            <tbody id="usersTable"></tbody>
          </table>
        </section>

        <!-- Feedback -->
        <section id="sec-feedback" class="admin-section">
          <div class="fb-filter" id="fbFilter">
            <button class="active" data-status="">全部</button>
            <button data-status="pending">待处理</button>
            <button data-status="reviewed">已查看</button>
            <button data-status="resolved">已解决</button>
          </div>
          <div id="feedbackList"></div>
        </section>
        <!-- POI Management -->
        <section id="sec-pois" class="admin-section">
          <div class="poi-toolbar">
            <select id="poiCitySelect" class="poi-select"></select>
            <select id="poiTypeFilter" class="poi-select">
              <option value="">全部类型</option>
              <option value="attraction">景点</option>
              <option value="restaurant">餐厅</option>
              <option value="hotel">酒店</option>
              <option value="transit">交通</option>
              <option value="nightlife">夜间活动</option>
            </select>
            <input type="text" id="poiSearch" placeholder="搜索名称/ID..." class="poi-input" />
            <span id="poiCount" class="poi-count"></span>
          </div>
          <div id="poiList" class="poi-list"></div>
          <div id="poiPagination" class="poi-pagination"></div>
        </section>
        <!-- POI Edit Modal -->
        <div id="poiEditModal" class="poi-modal" hidden>
          <div class="poi-modal-overlay"></div>
          <div class="poi-modal-content">
            <div class="poi-modal-header">
              <h3 id="poiModalTitle">编辑 POI</h3>
              <button id="poiModalClose" class="poi-modal-close">&times;</button>
            </div>
            <div class="poi-modal-body" id="poiModalBody"></div>
            <div class="poi-modal-footer">
              <button id="poiModalCancel" class="btn-cancel">取消</button>
              <button id="poiModalSave" class="btn-save">保存</button>
            </div>
          </div>
        </div>
        <!-- Image Picker Modal -->
        <div id="imagePickerModal" class="poi-modal" hidden>
          <div class="poi-modal-overlay"></div>
          <div class="poi-modal-content poi-modal-wide">
            <div class="poi-modal-header">
              <h3>选择主图</h3>
              <button id="imagePickerClose" class="poi-modal-close">&times;</button>
            </div>
            <div class="poi-modal-body" id="imagePickerBody"></div>
            <div class="poi-modal-footer">
              <button id="imagePickerCancel" class="btn-cancel">取消</button>
              <button id="imagePickerSave" class="btn-save">确认选择</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/admin.js"></script>
  </body>
</html>
