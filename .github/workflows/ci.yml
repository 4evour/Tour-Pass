name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cmake:
    name: CMake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Validate sample data
        run: node scripts/validate_data.js

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: API smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/api_smoke.ps1 -AppPath "$PWD/build/Release/tourpass.exe" -Port 8091

  docker:
    name: Docker image and smoke
    runs-on: ubuntu-latest
    needs: cmake

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Build image
        run: docker build -t tour-pass:ci .

      - name: Run container
        run: |
          docker run -d --rm \
            --name tour-pass-ci \
            -p 8080:8080 \
            -e LLM_DISABLED=1 \
            tour-pass:ci

      - name: Container API smoke
        run: node scripts/container_smoke.js http://127.0.0.1:8080

      - name: Container logs on failure
        if: failure()
        run: docker logs tour-pass-ci || true

      - name: Stop container
        if: always()
        run: docker stop tour-pass-ci || true

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/tour-pass:latest"
          docker tag tour-pass:ci "$IMAGE"
          docker push "$IMAGE"
