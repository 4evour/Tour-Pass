name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cmake:
    name: CMake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate sample data
        run: npm run validate:data

      - name: Validate all city data
        run: npm run validate:data:all

      - name: Validate all-city data gate
        run: npm run test:validate-data-all

      - name: Install Python Agent dependencies
        run: python -m pip install -r requirements-multi-agent.txt

      - name: Multi-Agent tests
        run: npm run test:multi-agent

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTOURPASS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install editor dependencies
        run: npm ci
        working-directory: web/editor

      - name: Editor tests
        run: npm run test
        working-directory: web/editor

      - name: Editor build
        run: npm run build
        working-directory: web/editor

      - name: API smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/api_smoke.ps1 -AppPath "$PWD/build/Release/tourpass.exe" -Port 8091

  docker:
    name: Docker image and smoke
    runs-on: ubuntu-latest
    needs: cmake

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Build image
        run: docker build -t tour-pass:ci .

      - name: Run container
        run: |
          docker run -d --rm \
            --name tour-pass-ci \
            -p 8080:8080 \
            -e LLM_DISABLED=1 \
            -e DEEPSEEK_API_KEY=ci-dummy-key \
            -e AGENT_PORT=8090 \
            -e TOURPASS_JWT_SECRET=ci-smoke-test-secret-32chars! \
            tour-pass:ci

      - name: Container API smoke
        run: node scripts/container_smoke.js http://127.0.0.1:8080

      - name: Container logs on failure
        if: failure()
        run: docker logs tour-pass-ci || true

      - name: Stop container
        if: always()
        run: docker stop tour-pass-ci || true

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/tour-pass:latest"
          docker tag tour-pass:ci "$IMAGE"
          docker push "$IMAGE"
